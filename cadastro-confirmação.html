<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Executive Aviation — Cadastro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
  <div class="screen screen-tight screen-relative">

    <details class="lang-switch">
      <summary>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"/></svg>
      </summary>
      <div class="lang-menu">
        <a href="#">Português (Br)</a>
        <a href="#">Português (Pt)</a>
        <a href="#">English</a>
        <a href="#">Español</a>
        <a href="#">Deutsch</a>
      </div>
    </details>

    <div class="login-hero">
      <img class="hero-logo" src="logo.png" alt="Aurora Executive Aviation">
    </div>

    <div class="login-title-row"><span>Confirmação</span></div>

    <div class="summary-card">
      <div class="summary-head">
        <span>Resumo dos Dados</span>
        <a href="cadastro.html" class="link-blue">Editar</a>
      </div>
      <div class="summary-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1.6-4 5-5.6 7.5-5.6s5.9 1.6 7.5 5.6"/></svg>
        <div><div class="sr-label">Nome completo</div><div class="sr-value">Enzo C. Camargo</div></div>
      </div>
      <div class="summary-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
        <div><div class="sr-label">Data de Nascimento</div><div class="sr-value">28/08/2009</div></div>
      </div>
      <div class="summary-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"/></svg>
        <div><div class="sr-label">Nacionalidade</div><div class="sr-value">Brasileiro</div></div>
      </div>
      <div class="summary-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1.6-4 5-5.6 7.5-5.6s5.9 1.6 7.5 5.6"/></svg>
        <div><div class="sr-label">CPF</div><div class="sr-value">500.134.863-30</div></div>
      </div>
      <div class="summary-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h3.5l1.5 4.5-2 1.5a12 12 0 0 0 6 6l1.5-2 4.5 1.5V19a2 2 0 0 1-2 2C10.5 21 3 13.5 3 6a2 2 0 0 1 2-2Z"/></svg>
        <div><div class="sr-label">Telefone</div><div class="sr-value">55 (51) 99857-7940</div></div>
      </div>
    </div>

    <div class="form-group-title">Criação da Senha</div>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
      <input type="password" placeholder="Digite aqui sua senha">
    </div>

    <a href="home.html" class="btn btn-primary">Criar Conta</a>
    <div class="hint-text">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
      Seus dados estão sendo protegidos pela Aurora
    </div>

  </div>
</div>

</body>
</html>
