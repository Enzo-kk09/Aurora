<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Executive Aviation — Redefinição de Senha</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
  <div class="screen screen-tight screen-relative">

    <div class="topbar">
      <a class="icon-btn" href="verificar-codigo.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <div></div>
      <details class="lang-switch lang-switch-inline">
        <summary>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"/></svg>
        </summary>
        <div class="lang-menu">
          <a href="#">Português (Br)</a>
          <a href="#">Português (Pt)</a>
          <a href="#">English</a>
          <a href="#">Español</a>
          <a href="#">Deutsch</a>
        </div>
      </details>
    </div>

    <div class="login-hero">
      <img class="hero-logo" src="logo.png" alt="Aurora Executive Aviation">
    </div>

    <div class="login-title-row"><span>Redefinição de Senha</span></div>

    <div class="form-group-title">Redefinição</div>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
      <input type="password" placeholder="Digite aqui sua nova senha">
    </div>

    <div class="step-arrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v15M6 14l6 6 6-6"/></svg>
    </div>

    <div class="form-group-title">Definição da Senha</div>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
      <input type="password" placeholder="Confirmação da senha">
    </div>

    <a href="index.html" class="btn btn-primary">Concluir</a>

  </div>
</div>

</body>
</html>
