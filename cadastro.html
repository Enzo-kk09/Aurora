<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Executive Aviation — Cadastro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
  <div class="screen screen-tight screen-relative">

    <details class="lang-switch">
      <summary>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"/></svg>
      </summary>
      <div class="lang-menu">
        <a href="#">Português (Br)</a>
        <a href="#">Português (Pt)</a>
        <a href="#">English</a>
        <a href="#">Español</a>
        <a href="#">Deutsch</a>
      </div>
    </details>

    <div class="login-hero">
      <img class="hero-logo" src="logo.png" alt="Aurora Executive Aviation">
    </div>

    <div class="login-title-row"><span>Cadastro</span></div>

    <div class="form-group-title">Dados Pessoais</div>

    <span class="form-label">Nome completo</span>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1.6-4 5-5.6 7.5-5.6s5.9 1.6 7.5 5.6"/></svg>
      <input type="text" placeholder="Digite seu nome completo">
    </div>

    <span class="form-label">Data de Nascimento</span>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
      <input type="text" placeholder="DD/MM/AAAA">
    </div>

    <span class="form-label">Nacionalidade</span>
    <div class="select-field">
      <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"/></svg>
      <select>
        <option>Selecione sua nacionalidade</option>
        <option>Brasileiro</option>
        <option>Português</option>
        <option>Outra</option>
      </select>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
    </div>

    <span class="form-label">CPF</span>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1.6-4 5-5.6 7.5-5.6s5.9 1.6 7.5 5.6"/></svg>
      <input type="text" placeholder="xxx.xxx.xxx-xx">
    </div>

    <a href="cadastro-contato.html" class="btn btn-primary">Continuar</a>
    <div class="hint-text">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
      Seus dados estão sendo protegidos pela Aurora
    </div>

    <div class="bottom-link">Já tem uma conta? <a href="index.html" class="link-blue">Ir ao Login</a></div>

  </div>
</div>

</body>
</html>
