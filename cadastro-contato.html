<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Executive Aviation — Cadastro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
  <div class="screen screen-tight screen-relative">

    <details class="lang-switch">
      <summary>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"/></svg>
      </summary>
      <div class="lang-menu">
        <a href="#">Português (Br)</a>
        <a href="#">Português (Pt)</a>
        <a href="#">English</a>
        <a href="#">Español</a>
        <a href="#">Deutsch</a>
      </div>
    </details>

    <div class="login-hero">
      <img class="hero-logo" src="logo.png" alt="Aurora Executive Aviation">
    </div>

    <div class="login-title-row"><span>Cadastro</span></div>

    <div class="form-group-title">Contato</div>

    <span class="form-label">Email</span>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1.6-4 5-5.6 7.5-5.6s5.9 1.6 7.5 5.6"/></svg>
      <input type="email" placeholder="Digite seu email">
    </div>

    <span class="form-label">Telefone</span>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h3.5l1.5 4.5-2 1.5a12 12 0 0 0 6 6l1.5-2 4.5 1.5V19a2 2 0 0 1-2 2C10.5 21 3 13.5 3 6a2 2 0 0 1 2-2Z"/></svg>
      <input type="text" placeholder="(XX) XXXXX-XXXX">
    </div>

    <span class="form-label">Whatsapp (Opcional)</span>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l1.4-4.2A8 8 0 1 1 8.6 19L4 20Z"/><path d="M8.5 9.5c0 3.5 2.5 6 6 6"/></svg>
      <input type="text" placeholder="(XX) XXXXX-XXXX">
    </div>

    <hr class="hairline">

    <div class="form-group-title">Endereço</div>

    <div class="form-row-2">
      <div>
        <span class="form-label">CEP</span>
        <div class="field"><input type="text" placeholder="04785-000"></div>
      </div>
      <div>
        <span class="form-label">Cidade</span>
        <div class="field"><input type="text" placeholder="Sapiranga"></div>
      </div>
    </div>

    <div class="form-row-2">
      <div>
        <span class="form-label">País</span>
        <div class="field"><input type="text" placeholder="Brasil"></div>
      </div>
      <div>
        <span class="form-label">Estado</span>
        <div class="field"><input type="text" placeholder="RS"></div>
      </div>
    </div>

    <a href="cadastro-confirmacao.html" class="btn btn-primary">Continuar</a>
    <div class="hint-text">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
      Seus dados estão sendo protegidos pela Aurora
    </div>

  </div>
</div>

</body>
</html>
