<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Aurora Executive Aviation — Perfil</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
  <div class="screen">

    <div class="topbar">
      <a class="icon-btn" href="menu.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </a>
      <div class="brand">
        <img class="brand-logo" src="logo.png" alt="Aurora Executive Aviation">
      </div>
      <div class="spacer-icon"></div>

    <div class="profile-head">
      <div class="avatar">

      </div>
      <div>
        <div class="section-title">Informações Pessoais</div>
        <div class="p-name">Enzo Calegaro Camargo</div>
        <div class="p-doc">xxx.xxx.xxx-xx</div>
        <div class="p-birth">28/08/2009</div>
      </div>
    </div>

    <div class="card card-mb">
      <div class="section-title">Dados do Usuário</div>
      <div class="info-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 6.5 8 6 8-6"/></svg>
        <div>
          <div class="i-label">Email</div>
          <div class="i-value">enzo09calegaro@gmail.com</div>

      <div class="info-row info-row-tight">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h3.5l1.5 4.5-2 1.5a12 12 0 0 0 6 6l1.5-2 4.5 1.5V19a2 2 0 0 1-2 2C10.5 21 3 13.5 3 6a2 2 0 0 1 2-2Z"/></svg>
        <div>
          <div class="i-label">Número de Celular</div>
          <div class="i-value">(51) 99857-7940</div>
        </div>
      </div>

      <hr class="hairline hairline-tight">

      <div class="qr-wrap">
        <div class="qr-caption">Código de passagem</div>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&bgcolor=ffffff&color=0b1526&data=AURORA-ENZO-CALEGARO-09857-7940" alt="QR code do passageiro">
      </div>
    </div>

    <div class="card">
      <div class="section-title">Estatísticas Gerais do Usuário</div>
      <div class="stat-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>
        <div><div class="s-label">Horas de voo</div><div class="s-value">194 Horas</div></div>
      </div>
      <div class="stat-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"/></svg>
        <div><div class="s-label">Total de Km percorrido</div><div class="s-value">42.322 Km</div></div>
      </div>
      <div class="stat-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 21s-7-4.5-7-10V5l7-3 7 3v6c0 5.5-7 10-7 10Z"/><path d="M9.3 12l1.9 1.9 3.5-3.8"/></svg>

  <div class="bottom-nav">
    <a href="home.html" aria-label="Início">

    <a href="busca-voos.html" aria-label="Buscar voos">

    </a>
    <a class="active" href="perfil.html" aria-label="Perfil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.6-4.2 5-5.9 7.5-5.9s5.9 1.7 7.5 5.9"/></svg>
