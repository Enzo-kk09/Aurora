<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Executive Aviation — Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
  <div class="screen screen-tight screen-relative">

    <details class="lang-switch">
      <summary>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"/></svg>
      </summary>
      <div class="lang-menu">
        <a href="#">Português (Br)</a>
        <a href="#">Português (Pt)</a>
        <a href="#">English</a>
        <a href="#">Español</a>
        <a href="#">Deutsch</a>
      </div>
    </details>

    <div class="login-hero">
      <img class="hero-logo" src="logo.png" alt="Aurora Executive Aviation">
    </div>

    <div class="login-title-row">
      <h1>Login</h1>
    </div>

    <div>
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1.6-4 5-5.6 7.5-5.6s5.9 1.6 7.5 5.6"/></svg>
        <input type="text" placeholder="E-mail ou CPF" required>
      </div>

      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
        <input type="password" placeholder="Senha" required>
        <svg class="toggle-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>

      <div class="forgot-row"><a href="esqueci-senha.html" class="link-blue">Esqueceu sua senha?</a></div>

      <a href="home.html" class="btn btn-primary">Entrar</a>
    </div>

    <div class="login-divider">ou continue com</div>

    <div class="social-stack">
      
      <a href="home.html" class="btn btn-outline">
        <svg viewBox="0 0 48 48" width="18" height="18"><path fill="#FFC107" d="M43.6 20.5H42V20.4H24v7.2h11.3c-1.6 4.6-6 7.9-11.3 7.9-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.1-5.1C34 6.5 29.3 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6 4.4C13.9 15.9 18.6 12.5 24 12.5c3.1 0 5.9 1.2 8 3.1l5.1-5.1C34 6.5 29.3 4.5 24 4.5c-7.6 0-14.2 4.3-17.7 10.2z"/><path fill="#4CAF50" d="M24 43.5c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.4-4.5 2.3-7.2 2.3-5.3 0-9.7-3.3-11.3-7.9l-6.1 4.7C9.7 39.1 16.3 43.5 24 43.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20.4H24v7.2h11.3c-.8 2.2-2.2 4.1-4.1 5.5l6.2 5.2C40.9 35.6 43.5 30.2 43.5 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
        Conta Google
      </a>

      <a href="home.html" class="btn btn-outline">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M16.365 1.43c0 1.14-.462 2.222-1.226 3.03-.827.87-2.14 1.554-3.29 1.463-.132-1.11.42-2.284 1.19-3.06.83-.86 2.28-1.5 3.326-1.433zM20.6 17.29c-.417.965-.62 1.4-1.157 2.257-.75 1.2-1.81 2.69-3.12 2.7-1.16.01-1.46-.75-3.03-.74-1.57.01-1.9.76-3.06.74-1.31-.01-2.32-1.36-3.07-2.56-2.1-3.36-2.32-7.3-1.03-9.4.92-1.5 2.36-2.38 3.72-2.38 1.38 0 2.25.76 3.4.76 1.11 0 1.79-.76 3.4-.76 1.21 0 2.5.66 3.42 1.8-3 1.65-2.52 5.95.53 7.58z"/></svg>
        Apple
      </a>
    </div>

    <div class="signup-row">Não tem uma conta? <a href="cadastro.html" class="link-gold">Cadastre-se!</a></div>

  </div>
</div>

</body>
</html>
